        score: { type: number, format: double }
        found_at: { type: string, format: date-time }
    PromoteCandidateProduct:
      type: object
      required: [product, candidates]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidate" }
    PromoteCandidatesPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/PromoteCandidateProduct" }
        total_count:
          type: integer
          format: int64
          description: Full count of flagged community products.
    PromoteRequest:
      description: >
        Provider identity for an in-place promotion. type game
        products require igdb_game_id + platform_igdb_id and accept
        an optional pc_product_id (the listing can also arrive later
        via the mapping fix, once provider); console and accessory
        products require pc_product_id. The
        identity the product re-enters the index with completes with
        the doc's stored region/edition/variant.
      type: object
      properties:
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
    Providers:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          description: "Subset of: google, twitch, dev"
          items: { type: string }
    Recommendation:
      type: object
      required: [igdb_game_id, name, genres, score]
      properties:
        igdb_game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        first_release_date: { type: string, format: date }
        score: { type: number, format: double }
    RefreshAccepted:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/AcceptedStatus" }
    ReleaseDate:
      type: object
      required: [region, date]
      properties:
        region: { $ref: "#/components/schemas/ReleaseRegion" }
        date: { type: string, format: date }
    ReleaseRegion:
      type: string
      enum: [europe, north_america, australia, new_zealand, japan, china, asia, worldwide, korea, brazil]
    RematchAccepted:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/AcceptedStatus" }
    ReorderRequest:
      description: Neighbor entry ids around the drop slot; null marks a list edge. Both null is invalid.
      type: object
      properties:
        after_id: { type: string, format: uuid, nullable: true }
        before_id: { type: string, format: uuid, nullable: true }
    ResnapshotResult:
      type: object
      required: [products_seen, products_failed, entries_updated]
      properties:
        products_seen: { type: integer }
        products_failed: { type: integer }
        entries_updated: { type: integer }
    ResolveRequest:
      description: >
        type game requires igdb_game_id + platform_igdb_id (the
        platform must be one the game released on and not a
        digital-only platform). Game identity is
        listing-keyed - (game, platform, PriceCharting listing) - so
        edition/variant on a game resolve are ignored (entry-level
        facts, like pc_listing); region is a matching input only (see
        the region property) and never joins identity. Without
        pc_product_id the resolve auto-matches by the game name
        (region-steered) through the shared listing-search cache and
        lands on the winning listing's product; below the
        confidence threshold, or with the provider down, it lands on
        the game+platform's single unmatched product instead - never
        guessed. Optional match_hint (game only, ignored elsewhere)
        reweights the scoring toward variant text without changing the
        search query; a hint nothing matches makes the resolve
        conservative (unmatched).
        With pc_product_id (a manual match: the exact listing the user
        chose) auto-match is skipped and the resolve finds or mints
        the product carrying that listing (match_confidence 1.0,
        verified false); unknown id answers 404 unknown_pc_product,
        provider failure 502 upstream_unavailable. Resolves never
        touch an existing product's mapping; corrections stay on the
        admin mapping endpoint.
        console/accessory require pc_product_id;
        region/edition/variant distinguish physical variants and are
        part of hardware identity. type pc_listing requires
        pc_product_id and mints a price-anchor product for that exact
        listing; region/edition/variant are ignored (the listing IS
        the exact variant).
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/ProductType" }
        igdb_game_id: { type: integer, format: int64 }
        platform_igdb_id: { type: integer, format: int64 }
        pc_product_id: { type: integer, format: int64 }
        match_hint: { type: string, maxLength: 128 }
        region:
          type: string
          maxLength: 32
          description: >-
            For console/accessory: part of hardware identity, distinguishing
            physical variants. For game: a matching input only - the entry
            region (ntsc_u, ntsc_j, pal, region_free, korea, brazil,
            china) steers which PriceCharting listing auto-match lands
            on (JP and PAL listings live under region-prefixed or
            JP-named console axes; korea, brazil and china have no
            provider axis and match like ntsc_u) and is
            never stored on the product; ignored when pc_product_id is
            present; unknown values behave like ntsc_u. Ignored for
            pc_listing.
        edition: { type: string, maxLength: 128 }
        variant: { type: string, maxLength: 128 }
    Role:
      type: string
      enum: [user, admin]
    SavedView:
      type: object
      required: [id, name, slug, visibility, params, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: URL slug derived from the name (underscore transform); unique per user on its folded key.
        visibility: { $ref: "#/components/schemas/Visibility" }
        published_at:
          type: string
          format: date-time
          description: Stamped on each transition into listed.
        params:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScoreResponse:
      type: object
      required: [degraded, recommendations]
      properties:
        degraded:
          type: boolean
          description: True when candidate metadata fetches failed and some candidates were skipped.
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    SearchResult:
      description: >
        Flat result with a type discriminator. Game results carry the
        igdb_* fields; hardware results carry the pc_* fields plus the
        PriceCharting category (Systems, Controllers, Accessories).
        pc_listing results carry the pc_* fields, the PriceCharting
        category (empty when the provider lists none), and the standard
        per-listing loose/cib/new prices so variant prints are tellable
        apart.
      type: object
      required: [type, name]
      properties:
        type: { $ref: "#/components/schemas/SearchResultType" }
        name: { type: string }
        igdb_game_id: { type: integer, format: int64 }
        platforms:
          description: >
            Platforms the game released on, minus digital-only platforms
            (a game left with none is not returned). Games only.
          type: array
          items: { $ref: "#/components/schemas/PlatformRef" }
        first_release_date: { type: string, format: date }
        cover_url: { type: string }
        localizations:
          description: Per-region presentations of a game result (games only).
          type: array
          items: { $ref: "#/components/schemas/Localization" }
        matched_region:
          type: string
          description: >
            Set when the query matched a region's localized name or
            transliteration rather than the canonical name: that
            bundle's region identifier. Clients may present the region's
            data and preselect a matching entry region. Absent on
            canonical-name matches, hardware, pc_listing, and community
            results.
        pc_product_id: { type: integer, format: int64 }
        console_name: { type: string }
        category: { type: string }
        loose_cents: { type: integer, format: int64 }
        cib_cents: { type: integer, format: int64 }
        new_cents: { type: integer, format: int64 }
        origin:
          description: >
            Marks an interleaved community result (admin-minted,
            anchor-less); absent on provider results. Community results
            carry product_id + item_type + platform_name for the pick,
            community.cover_url as cover_url, and community.region as region.
            They are scored against the query by name similarity and merged into
            results by descending score (a provider result precedes a community
            result of equal score), capped at 10, for game and hardware
            searches only (never pc_listing). The provider cache stores
            provider results only - community items attach fresh on every
            search.
          allOf:
            - $ref: "#/components/schemas/ProductOrigin"
        product_id: { type: string, format: uuid }
        item_type: { $ref: "#/components/schemas/ItemType" }
        platform_name: { type: string }
        region: { type: string, description: "Community rows only - the community facts region, entry vocabulary." }
        developers:
          type: array
          items: { type: string }
          description: Community rows only - the curated developer names, for based-add prefill.
        publishers:
          type: array
          items: { type: string }
          description: Community rows only - the curated publisher names, for based-add prefill.
    SearchResultType:
      type: string
      enum: [game, hardware, pc_listing]
    SearchResults:
      type: object
      required: [degraded, results]
      properties:
        degraded:
          type: boolean
          description: True when the provider was unreachable and the local catalog answered instead.
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    SharedEntry:
      description: >
        The cross-user entry projection - a strict whitelist. No money
        fields (price paid, values, currency, purchase provenance,
        pricing mode) and no personal fields (status, rating, notes,
        location, backlog rank, external refs) may ever be added here
        without a deliberate privacy decision.
      type: object
      required: [id, item_type, media_type, display_name, region, packaging, has_box, has_manual, pinned, tags, created_at]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        item_type: { $ref: "#/components/schemas/ItemType" }
        media_type: { $ref: "#/components/schemas/MediaType" }
        display_name: { type: string }
        platform: { $ref: "#/components/schemas/EntryPlatform" }
        first_release_date: { type: string, format: date }
        cover_url: { type: string }
        localized_name:
          type: string
          description: Region-picked native-script title (server-derived from the entry's region; absent when the region has none).
        localized_name_translit:
          type: string
          description: Latin transliteration of localized_name's title (server-derived).
        localized_cover_url:
          type: string
          description: Region-picked box art URL (server-derived).
        developers:
          type: array
          items: { type: string }
        publishers:
          type: array
          items: { type: string }
        igdb_game_id: { type: integer, format: int64 }
        region: { type: string }
        edition: { type: string }
        packaging: { $ref: "#/components/schemas/Packaging" }
        has_box: { type: boolean }
        has_manual: { type: boolean }
        box_condition: { $ref: "#/components/schemas/ItemCondition" }
        manual_condition: { $ref: "#/components/schemas/ItemCondition" }
        item_condition: { $ref: "#/components/schemas/ItemCondition" }
        pinned: { type: boolean }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        created_at: { type: string, format: date-time }
    SharedEntryGroup:
      type: object
      required: [key, label, entries]
      properties:
        key: { type: string }
        label: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SharedEntry" }
    SharedEntryList:
      description: Exactly one of entries/groups is present (groups when the stored params group).
      type: object
      required: [total_count]
      properties:
        total_count: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SharedEntry" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SharedEntryGroup" }
    ShelfSocialSummary:
      type: object
      required: [shelf_id, like_count, comment_count, viewer_likes]
      properties:
        shelf_id: { type: string, format: uuid }
        like_count: { type: integer }
        comment_count: { type: integer, description: Live comments only. }
        viewer_likes: { type: boolean }
    Submission:
      description: >
        One catalog-submission lifecycle row for an entry. Rows
        persist as history (rejected and cancelled included; the
        rolling creation cap counts every attempt); deleting the entry
        removes them with it. product_id is the verdict's resolved
        product - recorded before adoption so an approve_new retry
        never mints twice.
      type: object
      required: [id, entry_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SubmissionStatus" }
        reject_reason: { type: string }
        product_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        resolution_ack_at:
          type: string
          format: date-time
          description: >
            When the submitter acknowledged an approved verdict (closed
            the approval banner). Absent until acknowledged.
    SubmissionStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    Tag:
      type: object
      required: [id, name, entry_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        entry_count: { type: integer }
    TagCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
    TagRef:
      description: A tag as embedded on an entry (no usage count).
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    UnmatchedProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of unmatched products, beyond this page.
    ValueHistory:
      type: object
      required: [available, points]
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; points is then empty.
        points:
          type: array
          items: { $ref: "#/components/schemas/ValuePoint" }
    ValuePoint:
      type: object
      required: [date, value_cents]
      properties:
        date: { type: string, format: date }
        value_cents: { type: integer, format: int64 }
    VerdictRequest:
      description: >
        One admin verdict. approve_new requires product;
        approve_existing requires product_id; reject requires reason.
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve_new, approve_existing, reject] }
        product: { $ref: "#/components/schemas/CommunityProductSpec" }
        product_id: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000 }
    ViewCreate:
      type: object
      required: [name, params]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        params:
          type: object
          additionalProperties: true
          description: Opaque frontend view state; at most 8192 marshaled bytes.
        visibility:
          default: private
          allOf:
            - $ref: "#/components/schemas/Visibility"
    Visibility:
      type: string
      enum: [private, unlisted, listed]
