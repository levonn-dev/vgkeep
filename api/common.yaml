openapi: 3.0.3
info:
  title: vgkeep shared API components
  version: 0.1.0
  description: >
    Component library shared by the six service contracts in this
    directory. Holds every schema that is part of more than one
    service's wire contract, plus the bearer security scheme. Not an
    API of its own (no paths); the service contracts reference it by
    relative $ref, and `task gen` bundles each service contract with these
    components inlined into api/bundled/.
paths: {}
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    catalogQ:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    entriesDeveloper:
      name: developer
      in: query
      required: false
      description: Developer names; an entry matches when any of its snapshotted developers is listed.
      schema:
        type: array
        maxItems: 50
        items: { type: string, maxLength: 120 }
    entriesItemCondition:
      name: item_condition
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items: { $ref: "#/components/schemas/ItemCondition" }
    entriesItemType:
      name: item_type
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items: { $ref: "#/components/schemas/ItemType" }
    entriesPackaging:
      name: packaging
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items: { $ref: "#/components/schemas/Packaging" }
    entriesPublisher:
      name: publisher
      in: query
      required: false
      description: Publisher names; same overlap matching as developer.
      schema:
        type: array
        maxItems: 50
        items: { type: string, maxLength: 120 }
    entriesRegion:
      name: region
      in: query
      required: false
      description: Known-value buckets; other stored strings only surface unfiltered.
      schema:
        type: array
        maxItems: 50
        items: { type: string, maxLength: 32 }
    entriesSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [name, release_date, purchased_at, created_at, value, paid, rating, backlog_rank]
        default: created_at
    entriesTagId:
      name: tag_id
      in: query
      required: false
      description: Entries carrying ALL listed tags.
      schema:
        type: array
        maxItems: 50
        items: { type: string, format: uuid }
    groupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: string
        enum: [platform, status, item_type, location, tag]
    offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    order:
      name: order
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: desc }
    platformId:
      name: platform_id
      in: query
      required: false
      description: IGDB platform ids (matches the creation-time snapshot).
      schema:
        type: array
        maxItems: 50
        items: { type: integer, format: int64 }
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items: { $ref: "#/components/schemas/EntryStatus" }
    tab:
      name: tab
      in: query
      required: true
      schema: { type: string, enum: [following, you] }
    userSearchQ:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    AcceptedStatus:
      type: string
      enum: [started]
    ActivityVerb:
      type: string
      enum: [followed_user, liked_shelf, commented_shelf, published_shelf]
    AdminSubmission:
      description: >
        One queue row: the submission plus the live proposal from the
        entry join (display_name, item_type, platform_name, region,
        edition, first_release_date pre-fill the curation form;
        entries carry no variant - the single edition field is the
        idiom).
      type: object
      required: [id, entry_id, user_id, status, display_name, item_type, region, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        entry_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SubmissionStatus" }
        display_name: { type: string }
        item_type: { $ref: "#/components/schemas/ItemType" }
        platform_name: { type: string }
        region: { type: string }
        edition: { type: string }
        first_release_date: { type: string, format: date }
        developers:
          type: array
          items: { type: string }
          description: The entry's developer credit facts, live from the proposal join; prefill the curation form.
        publishers:
          type: array
          items: { type: string }
          description: The entry's publisher credit facts, live from the proposal join; prefill the curation form.
        cover_url:
          type: string
          description: The entry's cover URL, live from the proposal join; prefills the curation cover field.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminSubmissionsPage:
      type: object
      required: [submissions, total_count]
      properties:
        submissions:
          type: array
          items: { $ref: "#/components/schemas/AdminSubmission" }
        total_count:
          type: integer
          format: int64
          description: Full pending count, beyond this page.
    BulkUpdateRequest:
      description: >
        Delta applied across the caller's own entries among entry_ids
        (foreign or unknown ids are silently not counted, same
        ownership-filtering posture as tag attachment). At least one
        of add_tag_ids / remove_tag_ids / status / storage_location
        must be present, else 400. storage_location's clearing rule is
        the OPPOSITE of the full-replacement update's: here an ABSENT
        storage_location leaves the field untouched, and an explicit
        empty string clears it.
      type: object
      required: [entry_ids]
      properties:
        entry_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        add_tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        remove_tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/EntryStatus" }
        storage_location:
          type: string
          maxLength: 200
          description: Empty string clears the field; an absent field leaves it untouched (see the operation description).
    BulkUpdateResult:
      type: object
      required: [updated_count]
      properties:
        updated_count:
          type: integer
          description: Count of the caller's own entries among entry_ids, whether or not any targeted field actually changed.
    CatalogPlatform:
      description: One platform-catalog row with its known aliases.
      type: object
      required: [igdb_id, name, aliases]
      properties:
        igdb_id: { type: integer, format: int64 }
        name: { type: string }
        aliases:
          description: Alternate spellings and abbreviations (compare case-insensitively).
          type: array
          items: { type: string }
    CatalogProvider:
      type: string
      enum: [igdb, pricecharting]
    CommunityMeta:
      description: >
        Facts curated at community mint time; retained after promotion
        as gap-fill (provider blocks win per-field where present).
      type: object
      properties:
        platform_name: { type: string }
        region:
          type: string
          maxLength: 32
          description: >
            Curated entry-vocabulary region fact (open-world; known
            values ntsc_u, ntsc_j, pal, region_free, korea, brazil,
            china).
        first_release_date: { type: string, format: date }
        developers:
          type: array
          items: { type: string }
          description: >
            Curated developer company names, one per element; served
            into entry credit snapshots when the provider block
            carries no developer credits (per-field gap-fill).
        publishers:
          type: array
          items: { type: string }
          description: >
            Curated publisher company names; same gap-fill posture as
            developers.
        cover_url:
          type: string
          description: >
            User-supplied cover image URL (https, never fetched
            server-side; the client renders it with a broken-image
            fallback). Served as the product cover when no provider
            cover is present; retained after promotion as gap-fill.
    CommunityProductSpec:
      description: >
        The curated fields for approve_new; mirrors the enrichment
        mint request (single edition field, no variant).
      type: object
      required: [type, name]
      properties:
        type: { $ref: "#/components/schemas/ItemType" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform_name: { type: string, maxLength: 100 }
        region:
          type: string
          maxLength: 32
          description: >
            Curated entry-vocabulary region fact; stored under the
            community facts block (community.region), not the
            product's top-level region field.
        edition:
          type: string
          maxLength: 128
          description: The entry idiom's single "Edition or variant" note.
        first_release_date: { type: string, format: date }
        developers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
          description: Curated developer company names, one per element.
        publishers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
          description: Curated publisher company names, one per element.
        cover_url:
          type: string
          maxLength: 512
          pattern: "^https://"
          description: Optional https cover image URL (validated by shape only, never fetched).
    CommunityProductsPage:
      type: object
      required: [products, total_count]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total_count:
          type: integer
          format: int64
          description: Full count of community products, beyond this page.
    CompanyCredit:
      type: object
      required: [name, developer, publisher]
      properties:
        name: { type: string }
        developer: { type: boolean }
        publisher: { type: boolean }
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
    CurrencySpend:
      type: object
      required: [currency, total_cents]
      properties:
        currency: { type: string }
        total_cents: { type: integer, format: int64 }
    Dashboard:
      type: object
      required: [total_entries, by_status, by_item_type, by_platform, spend, pricing]
      properties:
        total_entries: { type: integer }
        by_status:
          type: object
          additionalProperties: { type: integer }
        by_item_type:
          type: object
          additionalProperties: { type: integer }
        by_platform:
          type: array
          items: { $ref: "#/components/schemas/PlatformCount" }
        spend:
          type: array
          description: Sum of price_paid_cents per currency, over entries that record a price.
          items: { $ref: "#/components/schemas/CurrencySpend" }
        pricing: { $ref: "#/components/schemas/DashboardPricing" }
    DashboardPricing:
      type: object
      required: [available, priced_entries, unpriced_entries, excluded_entries]
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; total_value_cents is then absent.
        total_value_cents: { type: integer, format: int64 }
        priced_entries: { type: integer }
        unpriced_entries:
          type: integer
          description: Entries whose effective product is unmatched or lacks a price for their packaging.
        excluded_entries:
          type: integer
          description: Entries with pricing_mode disabled.
    DismissCandidateRequest:
      type: object
      required: [provider, provider_id]
      properties:
        provider: { $ref: "#/components/schemas/CatalogProvider" }
        provider_id: { type: integer, format: int64 }
    Entry:
      description: >
        One physical copy. On product-backed entries the catalog
        fields (item_type, display_name, platform, first_release_date,
        igdb_game_id) are immutable creation-time snapshots from the
        enrichment product and product_id remains the live join key
        for prices. A CUSTOM entry has no product_id: its display
        fields are user-owned and editable, platform carries the
        picked or normalized identity - name-only for escape-hatch
        free text - when supplied, and igdb_game_id is always absent.
        value_cents is composed at read time from the
        effective pricing product and the packaging-matched price
        field; (or, with pricing_mode custom, taken directly from
        custom_value_cents, packaging-independent); it is null when
        pricing_mode is disabled, the product is unmatched, no price
        exists for the packaging, or enrichment is temporarily
        unreachable.
      type: object
      required: [id, item_type, media_type, display_name, region,
                 packaging, has_box, has_manual, currency, pricing_mode, status,
                 pinned, source, tags, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        product_id:
          type: string
          format: uuid
          description: Absent on custom entries.
        item_type: { $ref: "#/components/schemas/ItemType" }
        media_type: { $ref: "#/components/schemas/MediaType" }
        display_name: { type: string }
        platform: { $ref: "#/components/schemas/EntryPlatform" }
        first_release_date: { type: string, format: date }
        cover_url:
          type: string
          description: >
            Cover art URL. For product-backed entries it is snapshotted
            from the product at creation (and refreshed on adoption).
            Custom entries may set their own (https, shape-validated).
            Absent on hardware and products without art (render a
            placeholder).
        localized_name:
          type: string
          description: Region-picked native-script title (server-derived from the entry's region; absent when the region has none).
        localized_name_translit:
          type: string
          description: Latin transliteration of localized_name's title (server-derived).
        localized_cover_url:
          type: string
          description: Region-picked box art URL (server-derived).
        developers:
          type: array
          items: { type: string }
          description: >-
            Developer company names snapshotted for the entry: IGDB
            credits where the product carries them, community curated
            lists as gap-fill, or the user's own facts on a custom
            entry. Absent when no credits are known.
        publishers:
          type: array
          items: { type: string }
          description: Publisher company names; same sourcing as developers.
        igdb_game_id:
          type: integer
          format: int64
          description: >
            The recommendation identity: snapshotted from the entry's
            own product, or from the proxy target on custom game
            entries (owning a reproduction of X means playing X).
        region: { type: string }
        edition:
          type: string
          description: >
            Per-copy variant note ("first print (glitched rev)",
            "black edition"): the idiom for variants of cataloged
            items is an entry on the base product with the variant
            recorded here.
        packaging: { $ref: "#/components/schemas/Packaging" }
        has_box: { type: boolean }
        has_manual: { type: boolean }
        box_condition: { $ref: "#/components/schemas/ItemCondition" }
        manual_condition: { $ref: "#/components/schemas/ItemCondition" }
        item_condition: { $ref: "#/components/schemas/ItemCondition" }
        price_paid_cents: { type: integer, format: int64 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string }
        pricing_mode: { $ref: "#/components/schemas/PricingMode" }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents:
          type: integer
          format: int64
          description: >
            The user-set market value (USD cents). With
            pricing_mode custom it IS the entry's value; under any
            other mode it persists as "last custom price" memory.
        custom_value_set_at:
          type: string
          format: date-time
          description: >
            Server-managed: stamped when custom_value_cents is first
            set or changes value, untouched otherwise. Read-only.
        custom_value_entered_cents:
          type: integer
          format: int64
          description: >
            The custom price exactly as the user typed it, in
            custom_value_entered_currency minor units (major units x
            100, including zero-decimal currencies). Display metadata
            only: no aggregation reads it; custom_value_cents remains
            the USD value used everywhere.
        custom_value_entered_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Currency of custom_value_entered_cents.
        status: { $ref: "#/components/schemas/EntryStatus" }
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string }
        storage_location: { type: string }
        pinned: { type: boolean }
        backlog_rank:
          type: string
          description: Present exactly while status is backlog; server-generated.
        source: { type: string, enum: [manual, steam, psn, epic] }
        external_ref: { type: string }
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagRef" }
        value_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        region_mismatch_ack_at:
          type: string
          format: date-time
          description: >
            Null until the owner dismisses the region-mismatch banner;
            cleared whenever region or product changes.
    EntryCreate:
      description: >
        Product-backed: product_id comes from a prior enrichment
        resolve and the catalog fields are snapshotted server-side
        (display_name/item_type/platform_name/first_release_date must
        NOT be sent). Custom (no product_id): display_name and
        item_type are required, platform_name and first_release_date
        optional; pricing_mode defaults to disabled and must not be
        auto. media_type accepts only physical (the column already
        allows digital: the API widens when platform sync arrives).
        source is server-set manual. pricing_product_id is required
        when pricing_mode is proxy; box_condition requires has_box and
        manual_condition requires has_manual. custom_value_cents is
        required when pricing_mode is custom.
      type: object
      required: [region, packaging]
      properties:
        product_id:
          type: string
          format: uuid
          description: Omit for a custom (off-catalog) entry.
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        item_type:
          description: Custom entries only (required there).
          allOf:
            - $ref: "#/components/schemas/ItemType"
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker (surfaces the entry in the platform filter).
        cover_url:
          type: string
          maxLength: 512
          pattern: "^https://"
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        developers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
          description: >-
            Custom entries only: developer company names, one per
            element. Ignored on product-backed creation, where the
            snapshot derives credits from the product.
        publishers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
          description: Custom entries only; publisher company names, one per element.
        media_type: { type: string, enum: [physical], default: physical }
        region:
          type: string
          maxLength: 32
          description: >-
            Entry region. Known values ntsc_u, ntsc_j, pal,
            region_free, korea, brazil and china are first-class:
            labeled in the UI, filterable, normalize-lever promotion
            targets, with release-date chains, availability rows, and
            localized display snapshots per region (ntsc_u and
            region_free render the canonical presentation by design).
            korea, brazil and china have no PriceCharting axis, so
            they price from base listings as their deliberate proxy.
            Any other non-empty string is stored verbatim as a
            display fact and prices like ntsc_u until the value
            graduates to the known set.
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging: { $ref: "#/components/schemas/Packaging" }
        has_box: { type: boolean, default: false }
        has_manual: { type: boolean, default: false }
        box_condition: { $ref: "#/components/schemas/ItemCondition" }
        manual_condition: { $ref: "#/components/schemas/ItemCondition" }
        item_condition: { $ref: "#/components/schemas/ItemCondition" }
        price_paid_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string, maxLength: 200 }
        pricing_mode:
          default: auto
          allOf:
            - $ref: "#/components/schemas/PricingMode"
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_currency: { type: string, pattern: "^[A-Z]{3}$" }
        match_provenance:
          type: string
          enum: [auto, user]
          default: auto
          description: >-
            Whose choice the matched product is. Send user only when
            the add flow's manual match picked the price listing;
            automated repoints (region edits, the entry rematch)
            never touch user rows. Not accepted on update - the
            server stamps user when the narrow product_id re-match
            arm fires.
        status:
          default: backlog
          allOf:
            - $ref: "#/components/schemas/EntryStatus"
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 10000 }
        storage_location: { type: string, maxLength: 200 }
        pinned: { type: boolean, default: false }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    EntryGroup:
      type: object
      required: [key, label, entries]
      properties:
        key: { type: string }
        label: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
    EntryList:
      description: >
        One page of the sorted, filtered sequence. Exactly one of
        entries/groups is present (groups when group_by was requested,
        partitioning this page only).
      type: object
      required: [pricing_available, total_count]
      properties:
        pricing_available:
          type: boolean
          description: False when enrichment was unreachable; every value_cents is null.
        total_count:
          type: integer
          description: Size of the full filtered set, before pagination.
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/EntryGroup" }
    EntryPlatform:
      description: >
        The entry's platform: a creation-time snapshot of the product's
        platform (both fields) on product-backed entries, or a
        user-supplied platform on custom entries - both fields when
        picked from the catalog or normalized by the admin lever,
        name-only for escape-hatch free text. Absent when neither
        exists.
      type: object
      required: [name]
      properties:
        igdb_platform_id:
          type: integer
          format: int64
          description: Absent on name-only custom entries.
        name: { type: string }
    EntryStatus:
      type: string
      enum: [backlog, playing, beaten, completed, dropped, shelved]
    EntryUpdate:
      description: >
        Full replacement of the mutable state; an absent optional field
        is cleared (the edit form holds the whole entry). media_type
        and custom-ness are immutable. product_id accepts one narrow
        change - re-matching an auto-priced entry off an unmatched
        game product onto a product of the same game and platform
        (see the field description); anything else answers 400 code
        invalid_product_change. That re-match stamps
        match_provenance=user; automated region repoints only ever run
        on match_provenance=auto entries. On custom entries
        display_name is required and platform_name/first_release_date
        replace like any optional field; on product-backed entries all
        three are rejected. tag_ids replaces the tag set; absent means
        no tags. custom_value_cents is required when pricing_mode is
        custom.
      type: object
      required: [region, packaging, pricing_mode, status, pinned]
      properties:
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker.
        cover_url:
          type: string
          maxLength: 512
          pattern: "^https://"
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        developers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
          description: Custom entries only; developer company names, one per element (full replacement).
        publishers:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 120 }
          description: Custom entries only; publisher company names, one per element (full replacement).
        product_id:
          type: string
          format: uuid
          description: >
            Narrow re-match. Accepted only when the entry is
            product-backed with pricing_mode auto, its current product
            is a game with no price mapping, and the new product is a
            game of the same family (same igdb game and platform);
            the same id as the entry already has is a no-op. Anything
            else answers 400 code invalid_product_change; enrichment
            unreachable answers 502 code enrichment_unavailable and
            leaves the entry unchanged. Snapshotted display fields
            stay as they are.
        region:
          type: string
          maxLength: 32
          description: >-
            Entry region. Known values ntsc_u, ntsc_j, pal,
            region_free, korea, brazil and china are first-class:
            labeled in the UI, filterable, normalize-lever promotion
            targets, with release-date chains, availability rows, and
            localized display snapshots per region (ntsc_u and
            region_free render the canonical presentation by design).
            korea, brazil and china have no PriceCharting axis, so
            they price from base listings as their deliberate proxy.
            Any other non-empty string is stored verbatim as a
            display fact and prices like ntsc_u until the value
            graduates to the known set. On an auto-provenance game entry, a region
            change repoints the entry to the sibling catalog product
            whose listing prices that region; snapshotted display
            fields re-derive from it.
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging: { $ref: "#/components/schemas/Packaging" }
        has_box: { type: boolean, default: false }
        has_manual: { type: boolean, default: false }
        box_condition: { $ref: "#/components/schemas/ItemCondition" }
        manual_condition: { $ref: "#/components/schemas/ItemCondition" }
        item_condition: { $ref: "#/components/schemas/ItemCondition" }
        price_paid_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$", default: USD }
        purchased_at: { type: string, format: date }
        purchased_from: { type: string, maxLength: 200 }
        pricing_mode: { $ref: "#/components/schemas/PricingMode" }
        pricing_product_id: { type: string, format: uuid }
        custom_value_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_cents: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
        custom_value_entered_currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { $ref: "#/components/schemas/EntryStatus" }
        rating: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 10000 }
        storage_location: { type: string, maxLength: 200 }
        pinned: { type: boolean }
        tag_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    FXRates:
      type: object
      required: [base, date, rates]
      properties:
        base:
          type: string
          description: Always USD.
        date:
          type: string
          description: Upstream snapshot date (YYYY-MM-DD), not the fetch time.
        rates:
          type: object
          description: >
            Target-units-per-USD by ISO 4217 code. USD itself is
            omitted (it is the base; conversion short-circuits).
          additionalProperties: { type: number, format: double }
    Handle:
      type: string
      minLength: 2
      maxLength: 30
      pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9_]{0,28}[a-zA-Z0-9])?$"
    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }
    Identity:
      type: object
      required: [id, provider, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        email:
          type: string
          description: Informational; the email the provider asserted when this identity last signed in.
        created_at: { type: string, format: date-time }
    IgdbMeta:
      description: Projection of the raw IGDB payload held in igdb_raw; refreshed on its own cadence.
      type: object
      required: [game_id, name, genres, themes, franchises, similar_games, companies, fetched_at]
      properties:
        game_id: { type: integer, format: int64 }
        name: { type: string }
        cover_url: { type: string }
        genres:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { type: string }
        franchises:
          type: array
          items: { type: string }
        similar_games:
          type: array
          items: { type: integer, format: int64 }
        companies:
          type: array
          items: { $ref: "#/components/schemas/CompanyCredit" }
        first_release_date:
          type: string
          format: date
          description: >
            Earliest date for the product's platform; the game-level
            first release when IGDB lists no dated rows for the
            platform.
        release_dates:
          description: >
            Per-region release dates for the product's platform, the
            earliest concrete date per region. Region values are
            canonical IGDB names (europe, north_america, australia,
            new_zealand, japan, china, asia, worldwide, korea, brazil).
            JP twin platforms fold into their sibling (SNES/Super Famicom,
            NES/Famicom).
          type: array
          items: { $ref: "#/components/schemas/ReleaseDate" }
        localizations:
          description: >
            Per-region presentations; absent both on projections
            predating the feature and on games with no localizations at
            all (an empty slice is omitted rather than sent).
          type: array
          items: { $ref: "#/components/schemas/Localization" }
        fetched_at: { type: string, format: date-time }
    ItemCondition:
      type: string
      enum: [mint, near_mint, very_good, good, acceptable, poor]
    ItemType:
      type: string
      enum: [game, console, accessory]
    LandingPage:
      type: string
      enum: [collection, feed, explore]
    LibraryEntry:
      type: object
      required: [igdb_game_id]
      properties:
        igdb_game_id: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 10 }
        status:
          type: string
          description: The caller's own status vocabulary; scoring only distinguishes "dropped".
    Localization:
      description: >
        One region's presentation of the game, merged from IGDB
        game_localizations and tagged alternative names. region is an
        IGDB region identifier served verbatim (ja-JP, EU, ko-KR,
        zh-CN, zh-TW, pt-BR;
        open-world - new identifiers pass through). name is the
        native-script title, translit its latin transliteration,
        cover_url the region's own box art; each is independently
        optional (rows are sparse - readers fall back per field).
      type: object
      required: [region]
      properties:
        region: { type: string }
        name: { type: string }
        translit: { type: string }
        cover_url: { type: string }
    MappingRequest:
      type: object
      required: [pc_product_id]
      properties:
        pc_product_id:
          type: integer
          format: int64
          nullable: true
          description: Null clears the mapping (the product becomes unmatched and held).
    MediaType:
      type: string
      enum: [physical, digital]
    NormalizeResult:
      type: object
      required: [scanned, normalized, skipped]
      properties:
        scanned: { type: integer }
        normalized: { type: integer }
        skipped: { type: integer }
    Packaging:
      type: string
      enum: [sealed, cib, loose]
    PlatformCatalog:
      type: object
      required: [platforms]
      properties:
        platforms:
          type: array
          items: { $ref: "#/components/schemas/CatalogPlatform" }
    PlatformCount:
      type: object
      required: [name, count]
