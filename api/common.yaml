    Product:
      type: object
      required: [id, type, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/ProductType" }
        name: { type: string }
        platform: { $ref: "#/components/schemas/PlatformRef" }
        region:
          type: string
          description: >
            Provider hardware identity fact; community products carry
            their region under community.region instead.
        edition: { type: string }
        variant: { type: string }
        igdb: { $ref: "#/components/schemas/IgdbMeta" }
        pricecharting: { $ref: "#/components/schemas/PricechartingMeta" }
        match_hold:
          type: boolean
          description: >
            Present true when an admin clear holds this product's
            mapping against a future automated match (resolve, or the
            entry-side re-match).
        origin:
          description: >
            Emitted only for admin-minted community products (absent
            means provider-identified). Community products live
            outside the provider identity indexes; their curated name
            is their identity.
          allOf:
            - $ref: "#/components/schemas/ProductOrigin"
        community: { $ref: "#/components/schemas/CommunityMeta" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductOrigin:
      type: string
      enum: [community]
    ProductType:
      type: string
      enum: [game, console, accessory, pc_listing]
    ProfileCard:
      description: The cross-user projection of a user. Never email, never roles.
      type: object
      required: [user_id, handle, profile_visibility]
      properties:
        user_id: { type: string, format: uuid }
