        following_count: { type: integer }
        viewer_follows: { type: boolean }
    PromoteCandidate:
      type: object
      required: [provider, provider_id, name, score, found_at]
      properties:
        provider: { $ref: "#/components/schemas/CatalogProvider" }
        provider_id: { type: integer, format: int64 }
