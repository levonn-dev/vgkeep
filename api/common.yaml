        name: { type: string }
        count: { type: integer }
    PlatformRef:
      type: object
      required: [igdb_platform_id, name]
      properties:
        igdb_platform_id: { type: integer, format: int64 }
        name: { type: string }
        logo_url:
          type: string
          description: IGDB platform logo; the display fallback for products without cover art.
        release_regions:
          description: >
            Distinct canonical IGDB release regions for this game on this
            platform (japan, north_america, europe, ...), ordered by that
            region's earliest release date on the platform (dateless rows
            last, then alphabetical). Platform-exact: JP twin platforms are
            NOT folded here (a Famicom row stays on Famicom), unlike the
            product projection's date fold - the physical release is
            platform-specific. Populated on game search results only;
            absent on product payloads and hardware results.
          type: array
          items: { $ref: "#/components/schemas/ReleaseRegion" }
    PricechartingMeta:
      description: >
        The PriceCharting mapping and current prices; refreshed daily.
