# release_regions is IGDB's release_region vendor enum (the wire id),
# decoded to its canonical name by services/enrichment/internal/igdb.RegionName.
# entry_region is the collector's-entry region a release badges as
# (1:1 mappings only; omitted otherwise). worldwide has none: it
# expands to the TV-standard trio (ntsc_u, ntsc_j, pal) instead of
# picking one - see frontend/src/lib/productTitle.ts's platformEntryRegions.
release_regions:
  - igdb_id: 1
    name: europe
    entry_region: pal
  - igdb_id: 2
    name: north_america
    entry_region: ntsc_u
  - igdb_id: 3
    name: australia
    entry_region: pal
  - igdb_id: 4
    name: new_zealand
    entry_region: pal
  - igdb_id: 5
    name: japan
    entry_region: ntsc_j
  - igdb_id: 6
    name: china
    entry_region: china
  - igdb_id: 7
    name: asia
    entry_region: ntsc_j
  - igdb_id: 8
    name: worldwide
  - igdb_id: 9
    name: korea
    entry_region: korea
  - igdb_id: 10
    name: brazil
    entry_region: brazil
