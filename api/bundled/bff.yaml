                $ref: '#/components/schemas/ShelfPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/shelves/{shelfId}/entries:
    get:
      operationId: listShelfEntries
      summary: A shelf's entries, whitelist-projected (proxied)
      description: |
        Applies the effective-visibility rule before relaying collection's whitelisted projection verbatim (money and personal fields never appear).
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: One page of the shelf's entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/shelves/{shelfId}/comments:
    get:
      operationId: listShelfComments
      summary: A shelf's live comments, newest first, keyset-paged (composed with batched author cards)
      description: |
        Applies the effective-visibility rule, then composes social's page with a batched author ProfileCard per comment (mirrors the feed's actor hydration). A card-fetch failure fails open: the page still serves, just without any author. Anything other than social's 200 (its own 400 on a malformed cursor included) still relays verbatim, unchanged from before.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Malformed cursor (code invalid_param)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createShelfComment
      summary: Comment on a shelf (proxied)
      description: Applies the effective-visibility rule before relaying the social service verbatim.
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: The comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid body (code invalid_body)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Comment cap reached - tombstones count (code cap_exceeded)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/comments/{commentId}:
    delete:
      operationId: deleteComment
      summary: Delete a comment; author tombstones body-NULL, shelf owner tombstones body-retained (proxied)
      description: |
        Relayed verbatim; the bff does not resolve the shelf for this call (social already knows the comment row's shelf and owner and authorizes by row).
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tombstoned
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Caller is neither author nor shelf owner (code forbidden)
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or already tombstoned (code comment_not_found)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/social/follows/{userId}:
    put:
      operationId: follow
      summary: Follow a user (idempotent) (proxied)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Following (already or newly)
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Self-follow (code self_follow)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (deliberately indistinguishable; code profile_not_found)
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Follow cap reached (code cap_exceeded)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unfollow
      summary: Unfollow a user (idempotent) (proxied)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Not following (already or newly)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/social/likes/{shelfId}:
    put:
      operationId: likeShelf
      summary: Like a shelf (idempotent) (proxied)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Liked (already or newly)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Unknown or private (deliberately indistinguishable; code shelf_not_found)
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Like cap reached (code cap_exceeded)
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: unlikeShelf
      summary: Remove a like (idempotent) (proxied)
      parameters:
        - name: shelfId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Not liked (already or newly)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/search/users:
    get:
      operationId: searchUsers
      summary: Substring search over listed profiles' handles (proxied)
      parameters:
        - $ref: '#/components/parameters/userSearchQ'
      responses:
        '200':
          description: Up to 20 listed matches
          content:
            application/json:
              schema:
                type: object
                required:
                  - profiles
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileCard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/shared/profiles/by-ids:
    get:
      operationId: getSharedProfilesByIds
      summary: Batch profile cards for hydration (relayed from the user service; visibility-independent - actions are signed)
      description: |
        Mirrors the user service's batch resolve verbatim: cards come back for the ids that exist regardless of visibility (page access is gated separately, per page). Backs the admin submissions queue's submitter-handle hydration.
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Cards for the ids that exist
          content:
            application/json:
              schema:
                type: object
                required:
                  - profiles
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfileCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/feed:
    get:
      operationId: getFeed
      summary: The caller's two-tab activity feed (fill loop, hydrated and gated)
      description: |
        Runs a fill loop against the social service: fetch a raw page, hydrate it (actor cards, shelf cards, comment excerpts), gate it by the tab's visibility rule, and repeat until limit survivors accumulate or the raw stream exhausts, capped at feedFillRounds rounds (a rare shortfall yields a slightly short page). Actions are signed, objects are gated: actor cards attach at any visibility; on tab=following a row naming a shelf survives only when the shelf is listed and its owner is listed, and a followed_user row survives only when the followee is listed; tab=you shows every row (the objects are the caller's own shelves). next_cursor is the raw cursor of the last consumed row; absent when the raw stream is exhausted with nothing left to resume from.
      parameters:
        - $ref: '#/components/parameters/tab'
        - $ref: '#/components/parameters/cursor'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One filled page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid tab or malformed cursor (code invalid_param)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
  /api/explore:
    get:
      operationId: getExplore
      summary: Browse shared shelves - newest-published or top-liked, listed-only
      description: |
        recent pages collection's listed shelves directly (no owner filter), gates each page's owner for listed-ness at the bff, and fills short pages by re-paging collection, up to a fixed round cap; next_offset carries the raw collection-space resume position and is present only while more rows remain - top is the fixed all-time like-count leaderboard (leaderboard order preserved, no deep paging, no next_offset), dropping anything that is not effectively listed by the time it is read. limit and offset apply to recent only; top always answers its own fixed-size leaderboard.
      parameters:
        - name: sort
          in: query
          required: true
          schema:
            type: string
            enum:
              - recent
              - top
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: One page of shelf cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          $ref: '#/components/responses/UpstreamError'
        default:
          $ref: '#/components/responses/InternalError'
components:
  responses:
    Unauthenticated:
      description: No valid session (cookie missing, malformed, expired, revoked, or denylisted)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server-side failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OriginForbidden:
      description: Mutating request from a foreign origin (code origin_forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamError:
      description: A downstream service failed (code upstream_error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Caller lacks the admin role (code forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Name already taken
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Handle changed too recently (code handle_cooldown; relayed from the user service)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Session refresh blocked on a dependency; retry (code user_unavailable)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FXRates:
      type: object
      required:
        - base
        - date
        - rates
      properties:
        base:
          type: string
          description: Always USD.
        date:
          type: string
          description: Upstream snapshot date (YYYY-MM-DD), not the fetch time.
        rates:
          type: object
          description: |
            Target-units-per-USD by ISO 4217 code. USD itself is omitted (it is the base; conversion short-circuits).
          additionalProperties:
            type: number
            format: double
    Providers:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          description: 'Subset of: google, twitch, dev'
          items:
            type: string
    Me:
      description: |
        Browser-facing projection of the user service's User. Timestamps are intentionally omitted; add fields only when the SPA has a concrete use for them.
      type: object
      required:
        - id
        - email
        - handle
        - roles
        - preferred_currency
        - profile_visibility
        - landing_page
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        handle:
          $ref: '#/components/schemas/Handle'
        avatar_url:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        preferred_currency:
          description: Display currency for market values; USD until set.
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
        profile_visibility:
          $ref: '#/components/schemas/Visibility'
        landing_page:
          description: Where the app opens after sign-in.
          allOf:
            - $ref: '#/components/schemas/LandingPage'
    UpdateMeRequest:
      type: object
      description: Absent fields keep their value; an empty avatar_url clears it.
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        avatar_url:
          type: string
          maxLength: 2048
        preferred_currency:
          $ref: '#/components/schemas/CurrencyCode'
        profile_visibility:
          $ref: '#/components/schemas/Visibility'
        landing_page:
          $ref: '#/components/schemas/LandingPage'
    Identity:
      type: object
      required:
        - id
        - provider
        - created_at
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        email:
          type: string
          description: Informational; the email the provider asserted when this identity last signed in.
        created_at:
          type: string
          format: date-time
    Identities:
      type: object
      required:
        - identities
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
    PlatformRef:
      type: object
      required:
        - igdb_platform_id
        - name
      properties:
        igdb_platform_id:
          type: integer
          format: int64
        name:
          type: string
        logo_url:
          type: string
          description: IGDB platform logo; the display fallback for products without cover art.
        release_regions:
          description: |
            Distinct canonical IGDB release regions for this game on this platform (japan, north_america, europe, ...), ordered by that region's earliest release date on the platform (dateless rows last, then alphabetical). Platform-exact: JP twin platforms are NOT folded here (a Famicom row stays on Famicom), unlike the product projection's date fold - the physical release is platform-specific. Populated on game search results only; absent on product payloads and hardware results.
          type: array
          items:
            $ref: '#/components/schemas/ReleaseRegion'
    CatalogPlatform:
      description: One platform-catalog row with its known aliases.
      type: object
      required:
        - igdb_id
        - name
        - aliases
      properties:
        igdb_id:
          type: integer
          format: int64
        name:
          type: string
        aliases:
          description: Alternate spellings and abbreviations (compare case-insensitively).
          type: array
          items:
            type: string
    PlatformCatalog:
      type: object
      required:
        - platforms
      properties:
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPlatform'
    SearchResult:
      description: |
        Flat result with a type discriminator. Game results carry the igdb_* fields; hardware results carry the pc_* fields plus the PriceCharting category (Systems, Controllers, Accessories). pc_listing results carry the pc_* fields, the PriceCharting category (empty when the provider lists none), and the standard per-listing loose/cib/new prices so variant prints are tellable apart.
      type: object
      required:
        - type
        - name
      properties:
        type:
          $ref: '#/components/schemas/SearchResultType'
        name:
          type: string
        igdb_game_id:
          type: integer
          format: int64
        platforms:
          description: |
            Platforms the game released on, minus digital-only platforms (a game left with none is not returned). Games only.
          type: array
          items:
            $ref: '#/components/schemas/PlatformRef'
        first_release_date:
          type: string
          format: date
        cover_url:
          type: string
        localizations:
          description: Per-region presentations of a game result (games only).
          type: array
          items:
            $ref: '#/components/schemas/Localization'
        matched_region:
          type: string
          description: |
            Set when the query matched a region's localized name or transliteration rather than the canonical name: that bundle's region identifier. Clients may present the region's data and preselect a matching entry region. Absent on canonical-name matches, hardware, pc_listing, and community results.
        pc_product_id:
          type: integer
          format: int64
        console_name:
          type: string
        category:
          type: string
        loose_cents:
          type: integer
          format: int64
        cib_cents:
          type: integer
          format: int64
        new_cents:
          type: integer
          format: int64
        origin:
          description: |
            Marks an interleaved community result (admin-minted, anchor-less); absent on provider results. Community results carry product_id + item_type + platform_name for the pick, community.cover_url as cover_url, and community.region as region. They are scored against the query by name similarity and merged into results by descending score (a provider result precedes a community result of equal score), capped at 10, for game and hardware searches only (never pc_listing). The provider cache stores provider results only - community items attach fresh on every search.
          allOf:
            - $ref: '#/components/schemas/ProductOrigin'
        product_id:
          type: string
          format: uuid
        item_type:
          $ref: '#/components/schemas/ItemType'
        platform_name:
          type: string
        region:
          type: string
          description: Community rows only - the community facts region, entry vocabulary.
        developers:
          type: array
          items:
            type: string
          description: Community rows only - the curated developer names, for based-add prefill.
        publishers:
          type: array
          items:
            type: string
          description: Community rows only - the curated publisher names, for based-add prefill.
    SearchResults:
      type: object
      required:
        - degraded
        - results
      properties:
        degraded:
          type: boolean
          description: True when the provider was unreachable and the local catalog answered instead.
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    IgdbMeta:
      description: Projection of the raw IGDB payload held in igdb_raw; refreshed on its own cadence.
      type: object
      required:
        - game_id
        - name
        - genres
        - themes
        - franchises
        - similar_games
        - companies
        - fetched_at
      properties:
        game_id:
          type: integer
          format: int64
        name:
          type: string
        cover_url:
          type: string
        genres:
          type: array
          items:
            type: string
        themes:
          type: array
          items:
            type: string
        franchises:
          type: array
          items:
            type: string
        similar_games:
          type: array
          items:
            type: integer
            format: int64
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyCredit'
        first_release_date:
          type: string
          format: date
          description: |
            Earliest date for the product's platform; the game-level first release when IGDB lists no dated rows for the platform.
        release_dates:
          description: |
            Per-region release dates for the product's platform, the earliest concrete date per region. Region values are canonical IGDB names (europe, north_america, australia, new_zealand, japan, china, asia, worldwide, korea, brazil). JP twin platforms fold into their sibling (SNES/Super Famicom, NES/Famicom).
          type: array
          items:
            $ref: '#/components/schemas/ReleaseDate'
        localizations:
          description: |
            Per-region presentations; absent both on projections predating the feature and on games with no localizations at all (an empty slice is omitted rather than sent).
          type: array
          items:
            $ref: '#/components/schemas/Localization'
        fetched_at:
          type: string
          format: date-time
    CompanyCredit:
      type: object
      required:
        - name
        - developer
        - publisher
      properties:
        name:
          type: string
        developer:
          type: boolean
        publisher:
          type: boolean
    ReleaseDate:
      type: object
      required:
        - region
        - date
      properties:
        region:
          $ref: '#/components/schemas/ReleaseRegion'
        date:
          type: string
          format: date
    Localization:
      description: |
        One region's presentation of the game, merged from IGDB game_localizations and tagged alternative names. region is an IGDB region identifier served verbatim (ja-JP, EU, ko-KR, zh-CN, zh-TW, pt-BR; open-world - new identifiers pass through). name is the native-script title, translit its latin transliteration, cover_url the region's own box art; each is independently optional (rows are sparse - readers fall back per field).
      type: object
      required:
        - region
      properties:
        region:
          type: string
        name:
          type: string
        translit:
          type: string
        cover_url:
          type: string
    PricechartingMeta:
      description: |
        The PriceCharting mapping and current prices; refreshed daily. Absent from a product when no candidate cleared the match confidence threshold (no guessing) and the mapping has not been corrected by an admin.
      type: object
      required:
        - pc_product_id
        - pc_name
        - console_name
        - match_confidence
        - verified
        - as_of
      properties:
        pc_product_id:
          type: integer
          format: int64
        pc_name:
          type: string
        console_name:
          type: string
        match_confidence:
          type: number
          format: double
        verified:
          type: boolean
        loose_cents:
          type: integer
          format: int64
        cib_cents:
          type: integer
          format: int64
        new_cents:
          type: integer
          format: int64
        as_of:
          type: string
          format: date-time
    Product:
      type: object
      required:
        - id
        - type
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ProductType'
        name:
          type: string
        platform:
          $ref: '#/components/schemas/PlatformRef'
        region:
          type: string
          description: |
            Provider hardware identity fact; community products carry their region under community.region instead.
        edition:
          type: string
        variant:
          type: string
        igdb:
          $ref: '#/components/schemas/IgdbMeta'
        pricecharting:
          $ref: '#/components/schemas/PricechartingMeta'
        match_hold:
          type: boolean
          description: |
            Present true when an admin clear holds this product's mapping against a future automated match (resolve, or the entry-side re-match).
        origin:
          description: |
            Emitted only for admin-minted community products (absent means provider-identified). Community products live outside the provider identity indexes; their curated name is their identity.
          allOf:
            - $ref: '#/components/schemas/ProductOrigin'
        community:
          $ref: '#/components/schemas/CommunityMeta'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CommunityMeta:
      description: |
        Facts curated at community mint time; retained after promotion as gap-fill (provider blocks win per-field where present).
      type: object
      properties:
        platform_name:
          type: string
        region:
          type: string
          maxLength: 32
          description: |
            Curated entry-vocabulary region fact (open-world; known values ntsc_u, ntsc_j, pal, region_free, korea, brazil, china).
        first_release_date:
          type: string
          format: date
        developers:
          type: array
          items:
            type: string
          description: |
            Curated developer company names, one per element; served into entry credit snapshots when the provider block carries no developer credits (per-field gap-fill).
        publishers:
          type: array
          items:
            type: string
          description: |
            Curated publisher company names; same gap-fill posture as developers.
        cover_url:
          type: string
          description: |
            User-supplied cover image URL (https, never fetched server-side; the client renders it with a broken-image fallback). Served as the product cover when no provider cover is present; retained after promotion as gap-fill.
    PromoteRequest:
      description: |
        Provider identity for an in-place promotion. type game products require igdb_game_id + platform_igdb_id and accept an optional pc_product_id (the listing can also arrive later via the mapping fix, once provider); console and accessory products require pc_product_id. The identity the product re-enters the index with completes with the doc's stored region/edition/variant.
      type: object
      properties:
        igdb_game_id:
          type: integer
          format: int64
        platform_igdb_id:
          type: integer
          format: int64
        pc_product_id:
          type: integer
          format: int64
    PromoteCandidate:
      type: object
