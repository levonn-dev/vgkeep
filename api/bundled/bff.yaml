          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
    EntryPlatform:
      description: |
        The entry's platform: a creation-time snapshot of the product's platform (both fields) on product-backed entries, or a user-supplied platform on custom entries - both fields when picked from the catalog or normalized by the admin lever, name-only for escape-hatch free text. Absent when neither exists.
      type: object
      required:
        - name
      properties:
        igdb_platform_id:
          type: integer
          format: int64
          description: Absent on name-only custom entries.
        name:
          type: string
    Entry:
      description: |
        One physical copy. On product-backed entries the catalog fields (item_type, display_name, platform, first_release_date, igdb_game_id) are immutable creation-time snapshots from the enrichment product and product_id remains the live join key for prices. A CUSTOM entry has no product_id: its display fields are user-owned and editable, platform carries the picked or normalized identity - name-only for escape-hatch free text - when supplied, and igdb_game_id is always absent. value_cents is composed at read time from the effective pricing product and the packaging-matched price field; (or, with pricing_mode custom, taken directly from custom_value_cents, packaging-independent); it is null when pricing_mode is disabled, the product is unmatched, no price exists for the packaging, or enrichment is temporarily unreachable.
      type: object
      required:
        - id
        - item_type
        - media_type
        - display_name
        - region
        - packaging
        - has_box
        - has_manual
        - currency
        - pricing_mode
        - status
        - pinned
        - source
        - tags
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          description: Absent on custom entries.
        item_type:
          $ref: '#/components/schemas/ItemType'
        media_type:
          $ref: '#/components/schemas/MediaType'
        display_name:
          type: string
        platform:
          $ref: '#/components/schemas/EntryPlatform'
        first_release_date:
          type: string
          format: date
        cover_url:
          type: string
          description: |
            Cover art URL. For product-backed entries it is snapshotted from the product at creation (and refreshed on adoption). Custom entries may set their own (https, shape-validated). Absent on hardware and products without art (render a placeholder).
        localized_name:
          type: string
          description: Region-picked native-script title (server-derived from the entry's region; absent when the region has none).
        localized_name_translit:
          type: string
          description: Latin transliteration of localized_name's title (server-derived).
        localized_cover_url:
          type: string
          description: Region-picked box art URL (server-derived).
        developers:
          type: array
          items:
            type: string
          description: 'Developer company names snapshotted for the entry: IGDB credits where the product carries them, community curated lists as gap-fill, or the user''s own facts on a custom entry. Absent when no credits are known.'
        publishers:
          type: array
          items:
            type: string
          description: Publisher company names; same sourcing as developers.
        igdb_game_id:
          type: integer
          format: int64
          description: |
            The recommendation identity: snapshotted from the entry's own product, or from the proxy target on custom game entries (owning a reproduction of X means playing X).
        region:
          type: string
        edition:
          type: string
          description: |
            Per-copy variant note ("first print (glitched rev)", "black edition"): the idiom for variants of cataloged items is an entry on the base product with the variant recorded here.
        packaging:
          $ref: '#/components/schemas/Packaging'
        has_box:
          type: boolean
        has_manual:
          type: boolean
        box_condition:
          $ref: '#/components/schemas/ItemCondition'
        manual_condition:
          $ref: '#/components/schemas/ItemCondition'
        item_condition:
          $ref: '#/components/schemas/ItemCondition'
        price_paid_cents:
          type: integer
          format: int64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        purchased_at:
          type: string
          format: date
        purchased_from:
          type: string
        pricing_mode:
          $ref: '#/components/schemas/PricingMode'
        pricing_product_id:
          type: string
          format: uuid
        custom_value_cents:
          type: integer
          format: int64
          description: |
            The user-set market value (USD cents). With pricing_mode custom it IS the entry's value; under any other mode it persists as "last custom price" memory.
        custom_value_set_at:
          type: string
          format: date-time
          description: |
            Server-managed: stamped when custom_value_cents is first set or changes value, untouched otherwise. Read-only.
        custom_value_entered_cents:
          type: integer
          format: int64
          description: |
            The custom price exactly as the user typed it, in custom_value_entered_currency minor units (major units x 100, including zero-decimal currencies). Display metadata only: no aggregation reads it; custom_value_cents remains the USD value used everywhere.
        custom_value_entered_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Currency of custom_value_entered_cents.
        status:
          $ref: '#/components/schemas/EntryStatus'
        rating:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
        storage_location:
          type: string
        pinned:
          type: boolean
        backlog_rank:
          type: string
          description: Present exactly while status is backlog; server-generated.
        source:
          type: string
          enum:
            - manual
            - steam
            - psn
            - epic
        external_ref:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        value_cents:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        region_mismatch_ack_at:
          type: string
          format: date-time
          description: |
            Null until the owner dismisses the region-mismatch banner; cleared whenever region or product changes.
    Submission:
