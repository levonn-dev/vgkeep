        item_type:
          description: Custom entries only (required there).
          allOf:
            - $ref: '#/components/schemas/ItemType'
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker (surfaces the entry in the platform filter).
        cover_url:
          type: string
          maxLength: 512
          pattern: ^https://
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        developers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: 'Custom entries only: developer company names, one per element. Ignored on product-backed creation, where the snapshot derives credits from the product.'
        publishers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Custom entries only; publisher company names, one per element.
