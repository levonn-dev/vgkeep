  parameters:
    catalogQ:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    entriesItemType:
      name: item_type
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/ItemType'
    statusFilter:
      name: status
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/EntryStatus'
    entriesPackaging:
      name: packaging
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/Packaging'
    entriesRegion:
      name: region
      in: query
