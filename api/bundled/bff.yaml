        purchased_at:
          type: string
          format: date
        purchased_from:
          type: string
          maxLength: 200
        pricing_mode:
          default: auto
          allOf:
            - $ref: '#/components/schemas/PricingMode'
        pricing_product_id:
          type: string
          format: uuid
        custom_value_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        custom_value_entered_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        custom_value_entered_currency:
          type: string
          pattern: ^[A-Z]{3}$
        match_provenance:
          type: string
          enum:
            - auto
            - user
          default: auto
          description: Whose choice the matched product is. Send user only when the add flow's manual match picked the price listing; automated repoints (region edits, the entry rematch) never touch user rows. Not accepted on update - the server stamps user when the narrow product_id re-match arm fires.
        status:
          default: backlog
          allOf:
            - $ref: '#/components/schemas/EntryStatus'
        rating:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 10000
        storage_location:
          type: string
          maxLength: 200
        pinned:
          type: boolean
          default: false
        tag_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    EntryUpdate:
      description: |
        Full replacement of the mutable state; an absent optional field is cleared (the edit form holds the whole entry). media_type and custom-ness are immutable. product_id accepts one narrow change - re-matching an auto-priced entry off an unmatched game product onto a product of the same game and platform (see the field description); anything else answers 400 code invalid_product_change. That re-match stamps match_provenance=user; automated region repoints only ever run on match_provenance=auto entries. On custom entries display_name is required and platform_name/first_release_date replace like any optional field; on product-backed entries all three are rejected. tag_ids replaces the tag set; absent means no tags. custom_value_cents is required when pricing_mode is custom.
      type: object
      required:
        - region
        - packaging
        - pricing_mode
        - status
        - pinned
      properties:
        display_name:
          type: string
          maxLength: 200
          description: Custom entries only (required there).
        platform_name:
          type: string
          maxLength: 100
          description: Custom entries only.
        platform_igdb_id:
          type: integer
          format: int64
          description: Custom entries only; the canonical platform id from the picker.
        cover_url:
          type: string
          maxLength: 512
          pattern: ^https://
          description: Custom entries only; an https cover image URL (validated by shape, never fetched).
        first_release_date:
          type: string
          format: date
          description: Custom entries only.
        developers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Custom entries only; developer company names, one per element (full replacement).
        publishers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Custom entries only; publisher company names, one per element (full replacement).
        product_id:
          type: string
          format: uuid
          description: |
            Narrow re-match. Accepted only when the entry is product-backed with pricing_mode auto, its current product is a game with no price mapping, and the new product is a game of the same family (same igdb game and platform); the same id as the entry already has is a no-op. Anything else answers 400 code invalid_product_change; enrichment unreachable answers 502 code enrichment_unavailable and leaves the entry unchanged. Snapshotted display fields stay as they are.
        region:
          type: string
          maxLength: 32
          description: 'Entry region. Known values ntsc_u, ntsc_j, pal, region_free, korea, brazil and china are first-class: labeled in the UI, filterable, normalize-lever promotion targets, with release-date chains, availability rows, and localized display snapshots per region (ntsc_u and region_free render the canonical presentation by design). korea, brazil and china have no PriceCharting axis, so they price from base listings as their deliberate proxy. Any other non-empty string is stored verbatim as a display fact and prices like ntsc_u until the value graduates to the known set. On an auto-provenance game entry, a region change repoints the entry to the sibling catalog product whose listing prices that region; snapshotted display fields re-derive from it.'
        edition:
          type: string
          maxLength: 200
          description: Per-copy variant note; the idiom for variants of cataloged items.
        packaging:
          $ref: '#/components/schemas/Packaging'
        has_box:
          type: boolean
          default: false
        has_manual:
          type: boolean
          default: false
        box_condition:
          $ref: '#/components/schemas/ItemCondition'
        manual_condition:
          $ref: '#/components/schemas/ItemCondition'
        item_condition:
          $ref: '#/components/schemas/ItemCondition'
        price_paid_cents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          default: USD
        purchased_at:
          type: string
          format: date
        purchased_from:
          type: string
          maxLength: 200
        pricing_mode:
          $ref: '#/components/schemas/PricingMode'
        pricing_product_id:
          type: string
          format: uuid
        custom_value_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        custom_value_entered_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        custom_value_entered_currency:
          type: string
          pattern: ^[A-Z]{3}$
        status:
          $ref: '#/components/schemas/EntryStatus'
        rating:
          type: integer
          minimum: 1
          maximum: 10
        notes:
          type: string
          maxLength: 10000
        storage_location:
          type: string
          maxLength: 200
        pinned:
          type: boolean
        tag_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    EntryList:
      description: |
        One page of the sorted, filtered sequence. Exactly one of entries/groups is present (groups when group_by was requested, partitioning this page only).
      type: object
      required:
        - pricing_available
        - total_count
      properties:
        pricing_available:
          type: boolean
          description: False when enrichment was unreachable; every value_cents is null.
        total_count:
          type: integer
          description: Size of the full filtered set, before pagination.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EntryGroup'
    EntryGroup:
      type: object
      required:
        - key
        - label
        - entries
      properties:
        key:
          type: string
        label:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
    BulkUpdateRequest:
      description: |
        Delta applied across the caller's own entries among entry_ids (foreign or unknown ids are silently not counted, same ownership-filtering posture as tag attachment). At least one of add_tag_ids / remove_tag_ids / status / storage_location must be present, else 400. storage_location's clearing rule is the OPPOSITE of the full-replacement update's: here an ABSENT storage_location leaves the field untouched, and an explicit empty string clears it.
      type: object
      required:
        - entry_ids
      properties:
        entry_ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
        add_tag_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        remove_tag_ids:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        status:
          $ref: '#/components/schemas/EntryStatus'
        storage_location:
          type: string
          maxLength: 200
          description: Empty string clears the field; an absent field leaves it untouched (see the operation description).
    BulkUpdateResult:
      type: object
      required:
        - updated_count
      properties:
        updated_count:
          type: integer
          description: Count of the caller's own entries among entry_ids, whether or not any targeted field actually changed.
    ReorderRequest:
      description: Neighbor entry ids around the drop slot; null marks a list edge. Both null is invalid.
      type: object
      properties:
        after_id:
          type: string
          format: uuid
          nullable: true
        before_id:
          type: string
          format: uuid
          nullable: true
    TagRef:
      description: A tag as embedded on an entry (no usage count).
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Tag:
      type: object
      required:
        - id
        - name
        - entry_count
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entry_count:
          type: integer
    TagCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    SavedView:
      type: object
      required:
        - id
        - name
        - slug
        - visibility
        - params
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: URL slug derived from the name (underscore transform); unique per user on its folded key.
        visibility:
          $ref: '#/components/schemas/Visibility'
        published_at:
          type: string
          format: date-time
          description: Stamped on each transition into listed.
        params:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ViewCreate:
      type: object
      required:
        - name
        - params
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        params:
          type: object
          additionalProperties: true
          description: Opaque frontend view state; at most 8192 marshaled bytes.
        visibility:
          default: private
          allOf:
            - $ref: '#/components/schemas/Visibility'
    PlatformCount:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
        count:
          type: integer
    CurrencySpend:
      type: object
      required:
        - currency
        - total_cents
      properties:
        currency:
          type: string
        total_cents:
          type: integer
          format: int64
    DashboardPricing:
      type: object
      required:
        - available
        - priced_entries
        - unpriced_entries
        - excluded_entries
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; total_value_cents is then absent.
        total_value_cents:
          type: integer
          format: int64
        priced_entries:
          type: integer
        unpriced_entries:
          type: integer
          description: Entries whose effective product is unmatched or lacks a price for their packaging.
        excluded_entries:
          type: integer
          description: Entries with pricing_mode disabled.
    Dashboard:
      type: object
      required:
        - total_entries
        - by_status
        - by_item_type
        - by_platform
        - spend
        - pricing
      properties:
        total_entries:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_item_type:
          type: object
          additionalProperties:
            type: integer
        by_platform:
          type: array
          items:
            $ref: '#/components/schemas/PlatformCount'
        spend:
          type: array
          description: Sum of price_paid_cents per currency, over entries that record a price.
          items:
            $ref: '#/components/schemas/CurrencySpend'
        pricing:
          $ref: '#/components/schemas/DashboardPricing'
    ValuePoint:
      type: object
      required:
        - date
        - value_cents
      properties:
        date:
          type: string
          format: date
        value_cents:
          type: integer
          format: int64
    ValueHistory:
      type: object
      required:
        - available
        - points
      properties:
        available:
          type: boolean
          description: False when enrichment was unreachable; points is then empty.
        points:
          type: array
          items:
            $ref: '#/components/schemas/ValuePoint'
    ProfileCard:
      description: The cross-user projection of a user. Never email, never roles.
      type: object
      required:
        - user_id
        - handle
        - profile_visibility
      properties:
        user_id:
          type: string
          format: uuid
        handle:
          $ref: '#/components/schemas/Handle'
        avatar_url:
          type: string
        profile_visibility:
          $ref: '#/components/schemas/Visibility'
    ShelfSocialSummary:
      type: object
      required:
        - shelf_id
        - like_count
        - comment_count
        - viewer_likes
      properties:
        shelf_id:
          type: string
          format: uuid
        like_count:
          type: integer
        comment_count:
          type: integer
          description: Live comments only.
        viewer_likes:
          type: boolean
    ProfileSocialSummary:
      type: object
      required:
        - follower_count
        - following_count
        - viewer_follows
      properties:
        follower_count:
          type: integer
        following_count:
          type: integer
        viewer_follows:
          type: boolean
    ShelfCard:
      description: |
        A shelf card as shown in a profile's shelf list, an activity feed excerpt, or an Explore grid. owner is embedded so a card renders without a second round trip; like_count/comment_count/ viewer_likes are present exactly when the page's social composition succeeded (all three absent together when the page fell back to social_available: false).
      type: object
      required:
        - id
        - name
        - slug
        - owner
        - entry_count
        - cover_urls
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        owner:
          $ref: '#/components/schemas/ProfileCard'
        published_at:
          type: string
          format: date-time
        entry_count:
          type: integer
        cover_urls:
          type: array
          items:
            type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        viewer_likes:
          type: boolean
    ShelfMeta:
      description: |
        A shelf's own identity and stored view state, without the owner card or social counts (those are ShelfPage's sibling fields).
      type: object
      required:
        - id
        - name
        - slug
        - params
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        params:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
    ShelfPage:
      description: |
        A single shared shelf's page composition: the shelf meta, its (non-private, by construction) owner card, and social counts when the social service answered. social is absent exactly when social_available is false (the social service degrades open; the page still renders).
      type: object
      required:
        - shelf
        - owner
        - social_available
      properties:
        shelf:
          $ref: '#/components/schemas/ShelfMeta'
        owner:
          $ref: '#/components/schemas/ProfileCard'
        social_available:
          type: boolean
        social:
          $ref: '#/components/schemas/ShelfSocialSummary'
    ProfilePage:
      description: |
        A profile's page composition: the profile card, social counts when the social service answered, and up to 50 of the owner's listed shelves (owners see exactly what visitors see). social is absent exactly when social_available is false (the social service degrades open; the page still renders).
      type: object
      required:
        - profile
        - social_available
        - shelves
        - total_count
      properties:
        profile:
          $ref: '#/components/schemas/ProfileCard'
        social_available:
          type: boolean
        social:
          $ref: '#/components/schemas/ProfileSocialSummary'
        shelves:
          type: array
          items:
            $ref: '#/components/schemas/ShelfCard'
        total_count:
          type: integer
          description: The owner's full listed-shelf count, beyond this page.
    Comment:
      description: |
        A live comment; tombstones never serialize (purge tombstones the row and clears the body; an anonymized comment never serializes again). author is the bff's batched ProfileCard hydration of author_id (the same composition FeedItem.actor uses): present on a GET list page when the author resolves, absent when the hydration batch fails open; never populated on the POST response (a verbatim create relay).
      type: object
      required:
        - id
        - shelf_id
        - author_id
        - body
        - created_at
      properties:
        id:
          type: string
          format: uuid
        shelf_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        body:
          type: string
        created_at:
          type: string
          format: date-time
        author:
          $ref: '#/components/schemas/ProfileCard'
    CommentList:
      type: object
      required:
        - comments
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        next_cursor:
          type: string
    CreateCommentRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    FeedItem:
      description: |
        One activity-feed row after the fill loop hydrates and gates it. actor always attaches (actions are signed, any visibility); shelf is present only for the three shelf verbs (liked_shelf, commented_shelf, published_shelf) whose object cleared the tab's gating rule; followed_user is present only for a surviving followed_user row and carries the followee's card; comment_excerpt is present only for a surviving commented_shelf row.
      type: object
      required:
        - id
        - verb
        - created_at
        - actor
      properties:
        id:
          type: string
          format: uuid
        verb:
          $ref: '#/components/schemas/ActivityVerb'
        created_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/ProfileCard'
        shelf:
          $ref: '#/components/schemas/ShelfCard'
        followed_user:
          $ref: '#/components/schemas/ProfileCard'
        comment_excerpt:
          type: string
    FeedPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        next_cursor:
          type: string
    ExplorePage:
      type: object
      required:
        - shelves
      properties:
        next_offset:
          type: integer
          minimum: 0
          description: |
            Present when more listed shelves remain to page through - recent sort only. The raw collection-space offset to resume from; absent once the listed-shelf stream is exhausted.
        shelves:
          type: array
          items:
            $ref: '#/components/schemas/ShelfCard'
    SharedEntry:
      description: |
        The cross-user entry projection - a strict whitelist. No money fields (price paid, values, currency, purchase provenance, pricing mode) and no personal fields (status, rating, notes, location, backlog rank, external refs) may ever be added here without a deliberate privacy decision.
      type: object
      required:
        - id
        - item_type
        - media_type
        - display_name
        - region
        - packaging
        - has_box
        - has_manual
        - pinned
        - tags
        - created_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        item_type:
          $ref: '#/components/schemas/ItemType'
        media_type:
          $ref: '#/components/schemas/MediaType'
        display_name:
          type: string
        platform:
          $ref: '#/components/schemas/EntryPlatform'
        first_release_date:
          type: string
          format: date
        cover_url:
          type: string
        localized_name:
          type: string
          description: Region-picked native-script title (server-derived from the entry's region; absent when the region has none).
        localized_name_translit:
          type: string
          description: Latin transliteration of localized_name's title (server-derived).
        localized_cover_url:
          type: string
          description: Region-picked box art URL (server-derived).
        developers:
          type: array
          items:
            type: string
        publishers:
          type: array
          items:
            type: string
        igdb_game_id:
          type: integer
          format: int64
        region:
          type: string
        edition:
          type: string
        packaging:
          $ref: '#/components/schemas/Packaging'
        has_box:
          type: boolean
        has_manual:
          type: boolean
        box_condition:
          $ref: '#/components/schemas/ItemCondition'
        manual_condition:
          $ref: '#/components/schemas/ItemCondition'
        item_condition:
          $ref: '#/components/schemas/ItemCondition'
        pinned:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        created_at:
          type: string
          format: date-time
    SharedEntryGroup:
      type: object
      required:
        - key
        - label
        - entries
      properties:
        key:
          type: string
        label:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SharedEntry'
    SharedEntryList:
      description: Exactly one of entries/groups is present (groups when the stored params group).
      type: object
      required:
        - total_count
      properties:
        total_count:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SharedEntry'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SharedEntryGroup'
    ProblemCode:
      description: |
        The full house code vocabulary across every service (Problem is shared, and the bff relays upstream codes verbatim).
      type: string
      enum:
        - cap_exceeded
        - comment_not_found
        - conflicting_order
        - email_unverified
        - enrichment_unavailable
        - entry_not_custom
        - entry_not_found
        - forbidden
        - handle_cooldown
        - handle_taken
        - identity_already_linked
        - identity_not_found
        - identity_taken
        - internal
        - invalid_body
        - invalid_callback
        - invalid_internal_token
        - invalid_param
        - invalid_product_change
        - invalid_refresh
        - invalid_state
        - invalid_token
        - last_identity
        - link_email_unverified
        - link_failed
        - missing_token
        - not_found
        - not_in_backlog
        - not_ready
        - origin_forbidden
        - product_matched
        - product_not_community
        - product_not_found
        - product_not_provider
        - product_referenced
        - profile_not_found
        - provider_error
        - refresh_in_progress
        - refresh_reused
        - rematch_in_progress
        - self_follow
        - shelf_not_found
        - submission_not_found
        - submission_pending
        - submission_rate_limited
        - submission_resolved
        - tag_cap_exceeded
        - tag_exists
        - tag_not_found
        - too_many_pending_submissions
        - unauthenticated
        - unknown_fixture
        - unknown_game
        - unknown_pc_product
        - unknown_pricing_product
        - unknown_product
        - unknown_provider
        - upstream_error
        - upstream_unavailable
        - user_not_found
        - user_service_error
        - user_unavailable
        - view_exists
        - view_not_found
    Handle:
      type: string
      minLength: 2
      maxLength: 30
      pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9_]{0,28}[a-zA-Z0-9])?$
    Role:
      type: string
      enum:
        - user
        - admin
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
    Visibility:
      type: string
      enum:
        - private
        - unlisted
        - listed
    LandingPage:
      type: string
      enum:
        - collection
        - feed
        - explore
    SearchResultType:
      type: string
      enum:
        - game
        - hardware
        - pc_listing
    ReleaseRegion:
      type: string
      enum:
        - europe
        - north_america
        - australia
        - new_zealand
        - japan
        - china
        - asia
        - worldwide
        - korea
        - brazil
    ProductOrigin:
      type: string
      enum:
        - community
    ItemType:
      type: string
      enum:
        - game
        - console
        - accessory
    ProductType:
      type: string
      enum:
        - game
        - console
        - accessory
        - pc_listing
    EntryStatus:
      type: string
      enum:
        - backlog
        - playing
        - beaten
        - completed
        - dropped
        - shelved
    Packaging:
