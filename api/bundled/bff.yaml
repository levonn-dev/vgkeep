        box_condition:
          $ref: '#/components/schemas/ItemCondition'
        manual_condition:
          $ref: '#/components/schemas/ItemCondition'
        item_condition:
          $ref: '#/components/schemas/ItemCondition'
        price_paid_cents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
