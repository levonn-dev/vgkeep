      schema:
        type: array
        maxItems: 50
        items:
          type: string
          maxLength: 120
    entriesPublisher:
      name: publisher
      in: query
      required: false
      description: Publisher names; same overlap matching as developer.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          maxLength: 120
    entriesItemCondition:
      name: item_condition
      in: query
      required: false
      schema:
        type: array
        maxItems: 50
        items:
          $ref: '#/components/schemas/ItemCondition'
    platformId:
      name: platform_id
      in: query
      required: false
      description: IGDB platform ids (matches the creation-time snapshot).
      schema:
        type: array
        maxItems: 50
        items:
          type: integer
          format: int64
    entriesTagId:
      name: tag_id
      in: query
      required: false
      description: Entries carrying ALL listed tags.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
    entriesSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
          - release_date
          - purchased_at
          - created_at
          - value
          - paid
          - rating
          - backlog_rank
