        first_release_date:
          type: string
          format: date
        developers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Curated developer company names, one per element.
        publishers:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 120
          description: Curated publisher company names, one per element.
        cover_url:
