          minimum: 1
          maximum: 50
          default: 20
    Recommendation:
      type: object
      required:
        - igdb_game_id
        - name
        - genres
        - score
      properties:
        igdb_game_id:
          type: integer
          format: int64
        name:
          type: string
        cover_url:
          type: string
        genres:
          type: array
          items:
            type: string
        first_release_date:
          type: string
          format: date
        score:
          type: number
          format: double
    ScoreResponse:
